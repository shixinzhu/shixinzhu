
name: Update GitHub Stats

on:
  schedule:
    # Daily at 03:00 UTC (12:00 JST)
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout profile repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Generate GitHub account statistics
      - name: Generate GitHub Stats
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=shixinzhu&show_icons=true&theme=default&include_all_commits=true&show=reviews
          path: profile/stats.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # 3. Generate top programming languages
      - name: Generate Top Languages
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=shixinzhu&layout=compact&langs_count=10&theme=default&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/top-langs.svg
          token: ${{ secrets.GH_STATS_TOKEN }}

      # 4. Commit generated statistics
      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          git diff --cached --quiet || \
            git commit -m "Update GitHub statistics"

          git push
